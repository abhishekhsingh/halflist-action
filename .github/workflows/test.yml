name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-stdio:
    name: test-stdio (mcp ${{ matrix.major }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: "1"
            spec: "mcp>=1.24,<2"
          - major: "2"
            spec: "mcp>=2.3,<3"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the test server's mcp SDK
        run: pip install "${{ matrix.spec }}"

      - name: Create test server
        run: |
          cat > test_server.py << 'PYEOF'
          try:
              from mcp.server.mcpserver import MCPServer

              server = MCPServer("test-server", version="1.0.0")
          except ImportError:  # mcp 1.x
              from mcp.server.fastmcp import FastMCP

              server = FastMCP("test-server")


          @server.tool()
          def greet(name: str) -> str:
              """Greet someone by name."""
              return f"Hello, {name}!"


          @server.tool()
          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b


          if __name__ == "__main__":
              server.run()
          PYEOF

      - name: Run halflist action (check)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: check

      - name: Run halflist action (audit)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: audit

      - name: Run halflist action (audit with JUnit)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: audit
          junit: 'true'

      - name: Verify JUnit XML was created
        run: |
          test -f halflist-results.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('halflist-results.xml'); print('Valid XML')"

      - name: Create halflist.toml
        run: |
          cat > halflist.toml << 'TOMLEOF'
          [server]
          transport = "stdio"
          command = "python3 test_server.py"
          TOMLEOF

      - name: Run halflist action (config file only, no command or url)
        id: config-only
        uses: ./
        with:
          config: halflist.toml

      - name: Verify config-only run passed
        run: test "${{ steps.config-only.outputs.result }}" = "pass"

      - name: Run halflist action with a pinned halflist version
        id: pinned
        uses: ./
        with:
          command: "python3 test_server.py"
          version: "1.0.2"

      - name: Verify the pinned run passed
        run: test "${{ steps.pinned.outputs.result }}" = "pass"

      - name: Run halflist action with no server configured (must fail)
        id: no-server
        uses: ./
        continue-on-error: true

      - name: Verify the missing-server run failed
        run: test "${{ steps.no-server.outcome }}" = "failure"

      - name: Verify the action left the job's mcp SDK untouched
        env:
          EXPECTED_MAJOR: ${{ matrix.major }}
        run: |
          python3 - << 'PYEOF'
          import importlib.metadata as m
          import os

          version = m.version("mcp")
          print("mcp in the job environment:", version)
          assert version.split(".")[0] == os.environ["EXPECTED_MAJOR"], version
          PYEOF

      - name: Verify the test server still starts after the action ran
        run: |
          python3 - << 'PYEOF'
          import importlib.util

          spec = importlib.util.spec_from_file_location("test_server", "test_server.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          print("test server imports fine:", module.server.name)
          PYEOF
