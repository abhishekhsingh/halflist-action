name: Test Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-stdio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test server deps
        # The test server uses the FastMCP API from mcp 1.x. mcp 2.x renamed it
        # and is not supported by mcp-halflist yet.
        run: pip install "mcp<2"

      - name: Create test server
        run: |
          cat > test_server.py << 'PYEOF'
          from mcp.server.fastmcp import FastMCP

          mcp = FastMCP("test-server")

          @mcp.tool()
          def greet(name: str) -> str:
              """Greet someone by name."""
              return f"Hello, {name}!"

          @mcp.tool()
          def add(a: int, b: int) -> int:
              """Add two numbers."""
              return a + b

          if __name__ == "__main__":
              mcp.run()
          PYEOF

      - name: Run halflist action (check)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: check

      - name: Run halflist action (audit)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: audit

      - name: Run halflist action (audit with JUnit)
        uses: ./
        with:
          command: "python3 test_server.py"
          mode: audit
          junit: 'true'

      - name: Verify JUnit XML was created
        run: |
          test -f halflist-results.xml
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('halflist-results.xml'); print('Valid XML')"

      - name: Create halflist.toml
        run: |
          cat > halflist.toml << 'TOMLEOF'
          [server]
          transport = "stdio"
          command = "python3 test_server.py"
          TOMLEOF

      - name: Run halflist action (config file only, no command or url)
        id: config-only
        uses: ./
        with:
          config: halflist.toml

      - name: Verify config-only run passed
        run: test "${{ steps.config-only.outputs.result }}" = "pass"

      - name: Run halflist action with no server configured (must fail)
        id: no-server
        uses: ./
        continue-on-error: true

      - name: Verify the missing-server run failed
        run: test "${{ steps.no-server.outcome }}" = "failure"
